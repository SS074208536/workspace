<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Command Center</title>
    <!-- Tailwind CSS CDN with Standard CSS Fallback -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; }
        .dark body { background-color: #020617; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-6 sticky top-0 z-30 shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-graduation-cap text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Academic Command Center</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">High School Senior Dashboard</p>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <!-- Subject Subtabs -->
            <div id="subject-tabs" class="hidden md:flex items-center space-x-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                <button onclick="switchTab('main')" id="tab-btn-main" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white dark:bg-slate-700 shadow-sm transition">
                    <i class="fa-solid fa-house mr-1"></i> Dashboard
                </button>
            </div>

            <!-- Add Subject Button -->
            <button onclick="openModal('subject-modal')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shadow transition flex items-center space-x-1.5">
                <i class="fa-solid fa-plus"></i>
                <span>Add Subject</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="flex-1 flex flex-col md:flex-row">
        
        <!-- Main Content Area -->
        <main id="main-content-area" class="flex-1 p-6 space-y-6">
            <!-- Dynamically Rendered -->
        </main>

        <!-- Daily Sidebar & Study Stopwatch -->
        <aside class="w-full md:w-96 bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 p-6 flex flex-col space-y-6 shrink-0">
            
            <!-- Live Study Stopwatch Widget -->
            <div class="bg-gradient-to-br from-indigo-500 to-violet-600 rounded-2xl p-5 text-white shadow-lg">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-bold text-sm flex items-center space-x-2">
                        <i class="fa-solid fa-stopwatch"></i>
                        <span>Study Stopwatch</span>
                    </h3>
                    <span id="timer-status-badge" class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full font-semibold">Ready</span>
                </div>
                
                <div class="space-y-3">
                    <select id="timer-subject-select" class="w-full px-3 py-2 bg-white/10 border border-white/20 rounded-xl text-xs text-white outline-none">
                        <!-- Populated via JS -->
                    </select>
                    
                    <div class="text-center py-2">
                        <div id="stopwatch-display" class="text-3xl font-mono font-ext500 font-bold tracking-wider">00:00:00</div>
                    </div>

                    <div class="flex space-x-2">
                        <button id="timer-toggle-btn" onclick="toggleStudyTimer()" class="flex-1 py-2 bg-white text-indigo-600 hover:bg-indigo-50 font-bold text-xs rounded-xl shadow transition">
                            <i class="fa-solid fa-play mr-1"></i> Start Studying
                        </button>
                        <button onclick="resetStudyTimer()" class="px-3 py-2 bg-white/10 hover:bg-white/20 text-white text-xs rounded-xl transition" title="Reset">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Upcoming Assignments -->
            <div class="space-y-3">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Upcoming This Week</h3>
                <div id="sidebar-upcoming-list" class="space-y-2">
                    <!-- Populated via JS -->
                </div>
            </div>

            <!-- Time Blocks -->
            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Daily Time Blocks</h3>
                    <button onclick="openModal('time-block-modal')" class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">+ Add Block</button>
                </div>
                <div id="time-blocks-container" class="space-y-2">
                    <!-- Populated via JS -->
                </div>
            </div>
        </aside>
    </div>

    <!-- Modals -->
    <!-- Assignment Modal -->
    <div id="assignment-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-slate-900 rounded-2xl w-full max-w-md p-6 border border-slate-200 dark:border-slate-800 shadow-2xl">
            <h3 class="font-bold text-lg mb-4">Add Assignment / Test</h3>
            <form onsubmit="handleAssignmentSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Title</label>
                    <input type="text" id="asg-title" required class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-sm outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Subject</label>
                        <select id="asg-subject" class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-sm outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Type</label>
                        <select id="asg-type" class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-sm outline-none">
                            <option value="homework">Homework</option>
                            <option value="test">Test / Exam</option>
                            <option value="project">Project</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Due Date</label>
                    <input type="date" id="asg-date" required class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-sm outline-none">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal('assignment-modal')" class="px-4 py-2 text-xs font-semibold text-slate-500">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold bg-indigo-600 text-white rounded-xl">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Subject Modal -->
    <div id="subject-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-slate-900 rounded-2xl w-full max-w-md p-6 border border-slate-200 dark:border-slate-800 shadow-2xl">
            <h3 class="font-bold text-lg mb-4">Add New Subject</h3>
            <form onsubmit="handleSubjectSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Subject Name</label>
                    <input type="text" id="sub-name" required placeholder="e.g. AP Physics C" class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-sm outline-none">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal('subject-modal')" class="px-4 py-2 text-xs font-semibold text-slate-500">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold bg-indigo-600 text-white rounded-xl">Create</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Time Block Modal -->
    <div id="time-block-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-slate-900 rounded-2xl w-full max-w-md p-6 border border-slate-200 dark:border-slate-800 shadow-2xl">
            <h3 class="font-bold text-lg mb-4">Add Time Block</h3>
            <form onsubmit="handleTimeBlockSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Start</label>
                        <input type="time" id="tb-start" required class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">End</label>
                        <input type="time" id="tb-end" required class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-sm outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Task</label>
                    <input type="text" id="tb-task" required class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Subject</label>
                    <select id="tb-subject" class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-sm outline-none"></select>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal('time-block-modal')" class="px-4 py-2 text-xs font-semibold text-slate-500">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold bg-indigo-600 text-white rounded-xl">Add</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        let appData = JSON.parse(localStorage.getItem('academic_dashboard_data')) || {
            subjects: [
                { id: 'math', name: 'AP Calculus BC', goalHours: 5, loggedHours: 3.5 },
                { id: 'chem', name: 'AP Chemistry', goalHours: 6, loggedHours: 4.0 }
            ],
            assignments: [
                { id: '1', title: 'Problem Set 4', subject: 'math', type: 'homework', date: new Date().toISOString().split('T')[0], completed: false }
            ],
            timeBlocks: []
        };

        let activeTab = 'main';
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();

        // Stopwatch variables
        let timerInterval = null;
        let stopwatchSeconds = 0;
        let isStudying = false;

        function saveData() {
            localStorage.setItem('academic_dashboard_data', JSON.stringify(appData));
        }

        function switchTab(tabId) {
            activeTab = tabId;
            render();
        }

        function render() {
            renderTabs();
            renderSidebar();
            populateSelects();

            const area = document.getElementById('main-content-area');
            if (activeTab === 'main') {
                area.innerHTML = `
                    <div class="max-w-5xl mx-auto space-y-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <h2 class="text-2xl font-bold">Dashboard</h2>
                                <p class="text-xs text-slate-500">Global academic calendar and assignments.</p>
                            </div>
                            <button onclick="openModal('assignment-modal')" class="px-4 py-2 bg-indigo-600 text-white text-xs font-semibold rounded-xl shadow">+ Add Item</button>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="font-bold text-sm">Monthly Calendar</h3>
                                <div class="flex space-x-2">
                                    <button onclick="changeMonth(-1)" class="w-8 h-8 rounded bg-slate-100 dark:bg-slate-800 text-xs"><i class="fa-solid fa-chevron-left"></i></button>
                                    <button onclick="changeMonth(1)" class="w-8 h-8 rounded bg-slate-100 dark:bg-slate-800 text-xs"><i class="fa-solid fa-chevron-right"></i></button>
                                </div>
                            </div>
                            <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-slate-400 mb-2">
                                <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
                            </div>
                            <div class="grid grid-cols-7 gap-2">${generateCalendar(null)}</div>
                        </div>
                    </div>
                `;
            } else {
                const sub = appData.subjects.find(s => s.id === activeTab);
                if (sub) {
                    const pct = Math.min(100, Math.round((sub.loggedHours / sub.goalHours) * 100));
                    let trophy = { icon: 'fa-medal text-amber-600', label: 'Bronze Learner' };
                    if (pct >= 100) trophy = { icon: 'fa-trophy text-amber-400 animate-bounce', label: 'Gold Champion' };
                    else if (pct >= 50) trophy = { icon: 'fa-award text-slate-300', label: 'Silver Achiever' };

                    area.innerHTML = `
                        <div class="max-w-5xl mx-auto space-y-6">
                            <div class="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-2xl p-6 text-white shadow-xl flex items-center justify-between">
                                <div>
                                    <span class="text-[10px] bg-white/20 px-2.5 py-1 rounded-full font-bold uppercase">Subject Workspace</span>
                                    <h2 class="text-3xl font-bold mt-1">${sub.name}</h2>
                                </div>
                                <div class="bg-white/10 backdrop-blur border border-white/20 rounded-xl p-3 flex items-center space-x-3">
                                    <i class="fa-solid ${trophy.icon} text-2xl"></i>
                                    <div>
                                        <div class="text-xs font-bold">${trophy.label}</div>
                                        <div class="text-[10px] text-indigo-100">${sub.loggedHours} / ${sub.goalHours} hrs logged</div>
                                    </div>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm flex flex-col justify-between">
                                    <div>
                                        <h3 class="font-bold text-sm mb-1">Weekly Goal Progress</h3>
                                        <div class="text-2xl font-bold mt-2">${pct}%</div>
                                    </div>
                                    <div class="w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full my-4 overflow-hidden">
                                        <div class="bg-indigo-600 h-full rounded-full transition-all" style="width: ${pct}%"></div>
                                    </div>
                                    <button onclick="editGoal('${sub.id}')" class="w-full py-2 bg-slate-100 dark:bg-slate-800 text-xs font-semibold rounded-xl">Edit Goal Hours</button>
                                </div>
                                <div class="md:col-span-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                                    <div class="flex justify-between items-center mb-4">
                                        <h3 class="font-bold text-sm">Subject Calendar & Assignments</h3>
                                        <button onclick="openModalForSubject('${sub.id}')" class="px-3 py-1.5 bg-indigo-600 text-white text-xs font-semibold rounded-xl">+ Add Item</button>
                                    </div>
                                    <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-slate-400 mb-2">
                                        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
                                    </div>
                                    <div class="grid grid-cols-7 gap-2">${generateCalendar(sub.id)}</div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    switchTab('main');
                }
            }
        }

        function renderTabs() {
            let html = `<button onclick="switchTab('main')" id="tab-btn-main" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition ${activeTab === 'main' ? 'bg-white dark:bg-slate-700 shadow-sm' : 'text-slate-500'}"><i class="fa-solid fa-house mr-1"></i> Dashboard</button>`;
            appData.subjects.forEach(sub => {
                html += `<button onclick="switchTab('${sub.id}')" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition ${activeTab === sub.id ? 'bg-white dark:bg-slate-700 shadow-sm' : 'text-slate-500'}">${sub.name}</button>`;
            });
            document.getElementById('subject-tabs').innerHTML = html;
        }

        function populateSelects() {
            const opts = appData.subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            document.getElementById('asg-subject').innerHTML = opts;
            document.getElementById('tb-subject').innerHTML = opts;
            document.getElementById('timer-subject-select').innerHTML = opts;
        }

        function renderSidebar() {
            const today = new Date();
            const upcoming = appData.assignments.filter(a => new Date(a.date) >= today && !a.completed);
            
            document.getElementById('sidebar-upcoming-list').innerHTML = upcoming.length === 0 
                ? `<p class="text-xs text-slate-400 italic">No upcoming items.</p>`
                : upcoming.map(item => `
                    <div class="p-2.5 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-100 dark:border-slate-800 flex justify-between items-center text-xs">
                        <div>
                            <span class="font-bold">${item.title}</span>
                            <div class="text-[10px] text-slate-400">Due ${item.date}</div>
                        </div>
                        <button onclick="toggleAssignment('${item.id}')" class="w-5 h-5 rounded-full border border-slate-300 flex items-center justify-center text-[10px] hover:bg-indigo-600 hover:text-white"><i class="fa-solid fa-check"></i></button>
                    </div>
                `).join('');

            document.getElementById('time-blocks-container').innerHTML = appData.timeBlocks.length === 0
                ? `<p class="text-xs text-slate-400 italic">No time blocks added.</p>`
                : appData.timeBlocks.map(tb => `
                    <div class="p-2.5 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-100 dark:border-slate-800 flex justify-between items-center text-xs">
                        <div>
                            <span class="font-bold text-indigo-600">${tb.start} - ${tb.end}</span>
                            <div>${tb.task}</div>
                        </div>
                        <button onclick="deleteTimeBlock('${tb.id}')" class="text-slate-400 hover:text-rose-500"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `).join('');
        }

        function generateCalendar(subjectFilter) {
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            let html = '';

            for (let i = 0; i < firstDay; i++) {
                html += `<div class="h-20 bg-slate-50/30 rounded-xl"></div>`;
            }
            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const items = appData.assignments.filter(a => a.date === dateStr && (!subjectFilter || a.subject === subjectFilter));
                html += `
                    <div class="h-20 bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800 rounded-xl p-1.5 flex flex-col justify-between overflow-y-auto">
                        <span class="text-[10px] font-bold text-slate-400">${day}</span>
                        <div class="space-y-0.5">
                            ${items.map(i => `<div onclick="toggleAssignment('${i.id}')" class="text-[9px] px-1 rounded truncate cursor-pointer ${i.completed ? 'bg-emerald-500 text-white line-through' : 'bg-indigo-100 dark:bg-indigo-950 text-indigo-600'}">${i.title}</div>`).join('')}
                        </div>
                    </div>
                `;
            }
            return html;
        }

        // Stopwatch Logic
        function toggleStudyTimer() {
            const btn = document.getElementById('timer-toggle-btn');
            const badge = document.getElementById('timer-status-badge');
            const subSelect = document.getElementById('timer-subject-select');

            if (!isStudying) {
                isStudying = true;
                subSelect.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-pause mr-1"></i> Stop & Save`;
                btn.className = "flex-1 py-2 bg-rose-600 text-white font-bold text-xs rounded-xl shadow transition";
                badge.innerText = "Studying...";
                badge.className = "text-[10px] bg-amber-400 text-slate-900 px-2 py-0.5 rounded-full font-bold animate-pulse";

                timerInterval = setInterval(() => {
                    stopwatchSeconds++;
                    const hrs = String(Math.floor(stopwatchSeconds / 3600)).padStart(2, '0');
                    const mins = String(Math.floor((stopwatchSeconds % 3600) / 60)).padStart(2, '0');
                    const secs = String(stopwatchSeconds % 60).padStart(2, '0');
                    document.getElementById('stopwatch-display').innerText = `${hrs}:${mins}:${secs}`;
                }, 1000);
            } else {
                clearInterval(timerInterval);
                isStudying = false;
                subSelect.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-play mr-1"></i> Start Studying`;
                btn.className = "flex-1 py-2 bg-white text-indigo-600 hover:bg-indigo-50 font-bold text-xs rounded-xl shadow transition";
                badge.innerText = "Ready";
                badge.className = "text-[10px] bg-white/20 px-2 py-0.5 rounded-full font-semibold";

                // Add hours to selected subject
                if (stopwatchSeconds > 0) {
                    const hoursToAdd = parseFloat((stopwatchSeconds / 3600).toFixed(2));
                    const subId = subSelect.value;
                    const sub = appData.subjects.find(s => s.id === subId);
                    if (sub) {
                        sub.loggedHours = parseFloat((sub.loggedHours + hoursToAdd).toFixed(2));
                        saveData();
                        render();
                        alert(`Successfully logged ${hoursToAdd} hours to ${sub.name}!`);
                    }
                    stopwatchSeconds = 0;
                    document.getElementById('stopwatch-display').innerText = "00:00:00";
                }
            }
        }

        function resetStudyTimer() {
            clearInterval(timerInterval);
            isStudying = false;
            stopwatchSeconds = 0;
            document.getElementById('stopwatch-display').innerText = "00:00:00";
            document.getElementById('timer-subject-select').disabled = false;
            document.getElementById('timer-toggle-btn').innerHTML = `<i class="fa-solid fa-play mr-1"></i> Start Studying`;
            document.getElementById('timer-toggle-btn').className = "flex-1 py-2 bg-white text-indigo-600 font-bold text-xs rounded-xl shadow transition";
            document.getElementById('timer-status-badge').innerText = "Ready";
            document.getElementById('timer-status-badge').className = "text-[10px] bg-white/20 px-2 py-0.5 rounded-full font-semibold";
        }

        // Modal Controls
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function openModalForSubject(subId) { openModal('assignment-modal'); document.getElementById('asg-subject').value = subId; }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

        // Form handlers
        function handleAssignmentSubmit(e) {
            e.preventDefault();
            appData.assignments.push({
                id: Date.now().toString(),
                title: document.getElementById('asg-title').value,
                subject: document.getElementById('asg-subject').value,
                type: document.getElementById('asg-type').value,
                date: document.getElementById('asg-date').value,
                completed: false
            });
            saveData();
            closeModal('assignment-modal');
            render();
        }

        function handleSubjectSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('sub-name').value;
            const id = name.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (!appData.subjects.some(s => s.id === id)) {
                appData.subjects.push({ id, name, goalHours: 5, loggedHours: 0 });
                saveData();
            }
            closeModal('subject-modal');
            render();
        }

        function handleTimeBlockSubmit(e) {
            e.preventDefault();
            appData.timeBlocks.push({
                id: Date.now().toString(),
                start: document.getElementById('tb-start').value,
                end: document.getElementById('tb-end').value,
                task: document.getElementById('tb-task').value,
                subject: document.getElementById('tb-subject').value
            });
            saveData();
            closeModal('time-block-modal');
            render();
        }

        function toggleAssignment(id) {
            const a = appData.assignments.find(item => item.id === id);
            if (a) { a.completed = !a.completed; saveData(); render(); }
        }

        function deleteTimeBlock(id) {
            appData.timeBlocks = appData.timeBlocks.filter(tb => tb.id !== id);
            saveData();
            render();
        }

        function editGoal(subId) {
            const sub = appData.subjects.find(s => s.id === subId);
            const val = prompt(`New weekly goal hours for ${sub.name}:`, sub.goalHours);
            if (val && !isNaN(val)) { sub.goalHours = parseFloat(val); saveData(); render(); }
        }

        function changeMonth(dir) {
            currentMonth += dir;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            render();
        }

        render();
    </script>
</body>
</html>
